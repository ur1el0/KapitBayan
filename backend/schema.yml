        fee_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: Clearance issuance fee in PHP
        fee_assessment_status:
          allOf:
          - $ref: '#/components/schemas/FeeAssessmentStatusEnum'
          readOnly: true
          description: |-
            Explicit provenance of clearance fee determination.

            * `AWAITING_ASSESSMENT` - Awaiting Assessment
            * `ASSESSED` - Staff-Assessed Fee
            * `WAIVED` - Staff-Approved Waiver
            * `STATUTORY_EXEMPT` - Statutory Exemption
        fee_assessed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when the clearance fee was assessed or waived.
        fee_waiver_reason:
          type: string
          readOnly: true
          description: Mandatory written justification when an ordinary fee is waived
            by staff.
        fee_assessed_by_name:
          type: string
          nullable: true
          readOnly: true
        payment_method:
          allOf:
