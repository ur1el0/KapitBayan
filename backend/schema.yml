  /api/v1/auth/platform/accounts/:
    get:
      operationId: api_v1_auth_platform_accounts_list
      description: Limited superuser recovery and active-state support for barangay
        accounts.
      summary: Search eligible barangay accounts for platform support
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          enum:
          - RESIDENT
          - FIELD_OFFICIAL
          - ADMIN
          type: string
          minLength: 1
        description: |-
          * `RESIDENT` - RESIDENT
          * `FIELD_OFFICIAL` - FIELD_OFFICIAL
          * `ADMIN` - ADMIN
      - in: query
        name: search
        schema:
          type: string
          maxLength: 120
      tags:
      - Platform Account Support
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlatformAccountSummaryList'
          description: ''
  /api/v1/auth/platform/accounts/{id}/:
    get:
      operationId: api_v1_auth_platform_accounts_retrieve
      description: Limited superuser recovery and active-state support for barangay
        accounts.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Platform Account Support
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountSummary'
          description: ''
    patch:
      operationId: api_v1_auth_platform_accounts_partial_update
      description: Limited superuser recovery and active-state support for barangay
        accounts.
      summary: Correct a barangay account email and send a secure setup/reset link
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Platform Account Support
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlatformAccountEmailCorrection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlatformAccountEmailCorrection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlatformAccountEmailCorrection'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccountSummary'
          description: ''
        '400':
          description: Invalid email, reason, or verification attestation
        '404':
          description: Account not found or not eligible
  /api/v1/auth/platform/accounts/{id}/send-password-link/:
    post:
      operationId: api_v1_auth_platform_accounts_send_password_link_create
      description: Limited superuser recovery and active-state support for barangay
        accounts.
      summary: Send a private setup/reset link to the verified account email
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Platform Account Support
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAccountRecoveryLink'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformAccountRecoveryLink'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformAccountRecoveryLink'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          description: Recovery email dispatch requested
        '400':
          description: Contact verification and reason are required
