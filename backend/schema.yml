      operationId: api_v1_tickets_priority_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this queue ticket.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueTicketPriority'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QueueTicketPriority'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QueueTicketPriority'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicket'
          description: ''
  /api/v1/tickets/live-status/:
    get:
      operationId: api_v1_tickets_live_status_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicket'
          description: ''
  /api/v1/tickets/next/:
    post:
      operationId: api_v1_tickets_next_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueTicket'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QueueTicket'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QueueTicket'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicket'
          description: ''
  /media/{path}:
    get:
      operationId: media_retrieve
      description: |-
        Serves media files securely with directory-aware access control.
        Ensures that sensitive government IDs and resident billings are strictly
        protected under RA 10173 while public assets (logos, announcements) remain accessible.
      parameters:
      - in: path
        name: path
        schema:
          type: string
          pattern: ^.*$
        required: true
      tags:
      - media
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
