  /api/v1/auth/import-residents/:
    post:
      operationId: api_v1_auth_import_residents_create
      description: Bulk imports residents from a historical Registry of Barangay Inhabitants
        (RBI) CSV file (Barangay Official only). Unlike resident self-service registration,
        historical RBI records do not require uploaded proof images; the authorized
        official's import serves as an administrative residency attestation. Imported
        resident accounts are assigned to the official's barangay, marked as pre-verified
        (is_verified=True), and provisioned without usable passwords. Durably logs
        audit provenance linked to the importing official, the CSV file, and the imported
        resident records.
      summary: Bulk Import Residents from CSV
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentImportResponse'
          description: ''
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentImportResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
