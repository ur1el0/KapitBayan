          readOnly: true
        payment_proof_url:
          type: string
          nullable: true
          readOnly: true
        payment_transacted_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
