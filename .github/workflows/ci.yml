name: KapitBayan CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gridy_db
          POSTGRES_USER: gridy_user
          POSTGRES_PASSWORD: gridy_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Manually install pytest since it's missing from requirements
          pip install pytest pytest-django pytest-cov

      - name: Run Django Pytest
        env:
          SECRET_KEY: "ci-dummy-key"
          DEBUG: "True"
          DATABASE_URL: "postgres://gridy_user:gridy_password@localhost:5432/gridy_db"
          KAPITBAYAN_TEST_USE_SQLITE: "False"
        run: |
          cd backend
          DJANGO_SETTINGS_MODULE=config.settings python -c "import django; django.setup(); from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor"
          python -m pytest --cov=. --cov-fail-under=75

  backend-image:
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build --tag kapitbayan-backend:ci ./backend

  compose-migration-gate:
    name: Compose migration gate smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Exercise Compose migration success and failure gates
        run: bash scripts/ci/compose-migration-gate-smoke.sh

  postgres-dns-reconnect-smoke:
    name: PostgreSQL DNS reconnect smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Exercise Django reconnect after database DNS reassignment
        run: bash scripts/ci/postgres-dns-reconnect-smoke.sh

  azure-bicep-compile:
    name: Azure foundation Bicep compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile foundation template and verify its safety contract
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            az bicep install --version v0.47.16
            version="$(az bicep version)"
            case "$version" in
              *0.47.16*) ;;
              *) echo "Unexpected Bicep compiler version: $version" >&2; exit 1 ;;
            esac
            template_json="$(mktemp)"
            trap 'rm -f "$template_json"' EXIT
            az bicep build --file infra/azure/pilot-foundation/main.bicep --stdout > "$template_json"
            python3 scripts/ci/check-azure-pilot-foundation.py "$template_json"

  acr-repository-parameter-tests:
    name: Azure pilot parameter preflight tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test offline ACR repository parameter validation
        run: python -m unittest discover -s scripts/ci -p 'test_acr_repository_parameters.py'

      - name: Test offline Azure pilot network parameter validation
        run: python -m unittest discover -s scripts/ci -p 'test_azure_pilot_parameters.py'

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Oxlint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest
        run: |
          cd frontend
          npx vitest run

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build

  frontend-image:
    needs: frontend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build --tag kapitbayan-frontend:ci ./frontend

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Analyze Dart Code
        run: |
          cd mobile
          # Keep informational SDK deprecations visible without failing CI;
          # analyzer warnings and errors remain fatal.
          flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run Widget & Unit Tests
        run: |
          cd mobile
          flutter test
